schema_version = 1
id = "de-DE"
version = "1"
name = "Standard German"
default_ignore_stress = true

# This is intentionally an MVP inventory, not a claim to enumerate every
# segment occurring in every German variety or loanword.
inventory = [
  "p", "b", "t", "d", "k", "ɡ",
  "f", "v", "s", "z", "ʃ", "ç", "x", "h",
  "m", "n", "ŋ", "l", "r", "ʀ", "ʁ", "j",
  "t͡s", "p͡f", "t͡ʃ",
  "i", "ɪ", "y", "ʏ", "e", "ɛ", "ø", "œ",
  "ə", "ɐ", "a", "u", "ʊ", "o", "ɔ"
]

# Sources are provenance pointers for profile review. No PHOIBLE data is
# copied into this file.
sources = [
  "PanPhon feature system: https://github.com/dmort27/panphon",
  "PHOIBLE German inventories, research cross-check only: https://phoible.org/languages/stan1295",
  "Kohler and Rodgers, Schwa deletion in German read and spontaneous speech: https://www.ipds.uni-kiel.de/kjk/pub_exx/aipuk35/kkjr.pdf"
]

[[sequence_equivalences]]
left = ["t", "s"]
right = ["t͡s"]
cost = 0.0
reason = "de-DE:affricate-notation"

[[sequence_equivalences]]
left = ["p", "f"]
right = ["p͡f"]
cost = 0.0
reason = "de-DE:affricate-notation"

[[sequence_equivalences]]
left = ["t", "ʃ"]
right = ["t͡ʃ"]
cost = 0.0
reason = "de-DE:affricate-notation"

# Heuristic v1 alignment cost. The linguistic equivalence is sourced;
# the numeric cost is an engineering parameter to be calibrated against
# reviewed benchmark examples.
[[sequence_equivalences]]
left = ["ə", "n"]
right = ["n̩"]
cost = 0.10
reason = "de-DE:unstressed-schwa-syllabic-nasal"

[[sequence_equivalences]]
left = ["ə", "m"]
right = ["m̩"]
cost = 0.10
reason = "de-DE:unstressed-schwa-syllabic-nasal"

[[sequence_equivalences]]
left = ["ə", "l"]
right = ["l̩"]
cost = 0.10
reason = "de-DE:unstressed-schwa-syllabic-lateral"
