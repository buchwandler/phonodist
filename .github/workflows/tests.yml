name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=phonodist --cov-report=term-missing --cov-report=xml
      - run: ruff check .
      - run: mypy phonodist

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/phonodist-wheel-venv
      - run: /tmp/phonodist-wheel-venv/bin/python -m pip install dist/*.whl
      - run: cd /tmp && /tmp/phonodist-wheel-venv/bin/python -c 'import phonodist; from phonodist import get_profile; assert get_profile("de-DE").id == "de-DE"; print(phonodist.__version__)'
