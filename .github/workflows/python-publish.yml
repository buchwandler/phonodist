name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write


jobs:
  verify:
    name: verify (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=phonodist --cov-report=term-missing
      - run: ruff check .
      - run: mypy phonodist

  build:
    name: build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  validate:
    name: validate release artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip build twine
      - name: Verify artifact version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          test -f "dist/phonodist-${expected}-py3-none-any.whl"
          test -f "dist/phonodist-${expected}.tar.gz"
          python - "${expected}" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          expected = sys.argv[1]
          wheel = Path(f"dist/phonodist-{expected}-py3-none-any.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "phonodist/py.typed" in names
          assert "phonodist/data/profiles/de-DE.toml" in names
          PY
      - run: python -m twine check dist/*
      - name: Install and smoke test wheel
        shell: bash
        run: |
          python -m venv /tmp/phonodist-release-check
          /tmp/phonodist-release-check/bin/python -m pip install dist/phonodist-*-py3-none-any.whl
          /tmp/phonodist-release-check/bin/python -m pip check
          /tmp/phonodist-release-check/bin/python -c 'from importlib.metadata import version; import os; assert version("phonodist") == os.environ["GITHUB_REF_NAME"][1:]'
          /tmp/phonodist-release-check/bin/phonodist --version
          /tmp/phonodist-release-check/bin/phonodist compare de-DE n̩ ən --explain

  publish:
    name: publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
