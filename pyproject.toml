[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "phonodist"
description = "Language-aware, explainable distance metrics for IPA pronunciations."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Holger Nahrstaedt"}]
keywords = ["ipa", "phonetics", "phonology", "pronunciation", "distance", "g2p", "tts"]
dynamic = ["version"]
dependencies = [
    "panphon>=0.22.2,<0.23",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build>=1",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
]

[project.scripts]
phonodist = "phonodist.cli:main"

[project.urls]
# Fill these after creating the repository.
# Repository = "https://github.com/buchwandler/phonodist"
# Issues = "https://github.com/buchwandler/phonodist/issues"

# Intentionally no src/ layer. The import package lives at ./phonodist.
[tool.setuptools.packages.find]
where = ["."]
include = ["phonodist*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
phonodist = [
    "py.typed",
    "data/profiles/*.toml",
]

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["panphon", "panphon.*", "tomli"]
ignore_missing_imports = true
